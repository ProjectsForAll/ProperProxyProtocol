plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom shadowBundle
}

String[] includeThese = [
        "io.netty:netty-codec-haproxy:4.1.112.Final",
]

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    compileOnly(includeThese)
    shadowBundle("io.netty:netty-codec-haproxy:4.1.112.Final") {
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    relocate 'io.netty.handler.codec.haproxy', "${project.group}.pptw.shadow.netty.haproxy"
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    zip64 true

    // Exclude JUnit and test-related classes
    exclude 'org/junit/**'
    exclude 'org/opentest4j/**'
    exclude 'org/apiguardian/**'

    // Exclude SLF4J - NeoForge provides this
    exclude 'org/slf4j/**'

    // Exclude multi-release JAR JUnit classes
    exclude 'META-INF/versions/**/org/junit/**'

    // Exclude problematic META-INF files
    exclude 'META-INF/services/org.junit.platform.engine.TestEngine'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.kotlin_module'
}

jar.enabled = false

remapJar {
    dependsOn shadowJar

    input.set shadowJar.archiveFile
}

artifacts {
    archives shadowJar
}